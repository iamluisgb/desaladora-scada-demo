<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desaladora RO — Manual Interactivo</title>
<style>
:root {
  --bg: #0a0e17; --panel: #111827; --border: #1e293b; --text: #e2e8f0;
  --muted: #64748b; --accent: #3b82f6; --green: #22c55e; --red: #ef4444;
  --orange: #f59e0b; --cyan: #06b6d4; --purple: #8b5cf6; --nav-w: 260px;
  --side-w: 320px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg); color: var(--text); display: flex;
  height: 100vh; overflow: hidden;
}

/* ── LEFT RAIL ── */
#nav { width: var(--nav-w); min-width: var(--nav-w); background: var(--panel);
  border-right: 1px solid var(--border); display: flex; flex-direction: column;
  transition: margin-left 0.3s; overflow-y: auto; }
#nav.collapsed { margin-left: calc(var(--nav-w) * -1); }
#nav-toggle {
  position: fixed; left: calc(var(--nav-w) + 8px); top: 12px; z-index: 50;
  background: var(--panel); border: 1px solid var(--border); color: var(--text);
  width: 32px; height: 32px; border-radius: 8px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: left 0.3s; font-size: 1rem;
}
#nav.collapsed ~ #nav-toggle { left: 12px; }
.nav-header { padding: 16px; border-bottom: 1px solid var(--border); }
.nav-header h2 { font-size: 0.85rem; font-weight: 600; color: var(--accent);
  text-transform: uppercase; letter-spacing: 1px; }
.nav-header p { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }
.nav-section { padding: 8px 0; }
.nav-section-title { padding: 6px 16px; font-size: 0.7rem; color: var(--muted);
  text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
.nav-item {
  padding: 8px 16px 8px 24px; cursor: pointer; display: flex;
  align-items: center; gap: 10px; font-size: 0.85rem; color: var(--muted);
  border-left: 3px solid transparent; transition: all 0.2s;
}
.nav-item:hover { background: rgba(59,130,246,0.05); color: var(--text); }
.nav-item.active { color: var(--accent); border-left-color: var(--accent);
  background: rgba(59,130,246,0.08); }
.nav-item .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

/* ── MAIN ── */
#main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#toolbar {
  height: 48px; border-bottom: 1px solid var(--border); display: flex;
  align-items: center; padding: 0 20px; gap: 16px; flex-shrink: 0;
}
#toolbar h1 { font-size: 0.95rem; font-weight: 600; display: flex;
  align-items: center; gap: 8px; }
#toolbar h1 .sub { font-weight: 400; color: var(--muted); font-size: 0.8rem; }
#diagram-area { flex: 1; position: relative; overflow: hidden; }
#diagram-svg { width: 100%; height: 100%; }

/* ── RIGHT SIDEBAR ── */
#sidebar {
  width: var(--side-w); min-width: var(--side-w); background: var(--panel);
  border-left: 1px solid var(--border); overflow-y: auto;
  transition: margin-right 0.3s;
}
#sidebar.collapsed { margin-right: calc(var(--side-w) * -1); }
.side-header { padding: 16px; border-bottom: 1px solid var(--border); }
.side-header h3 { font-size: 0.8rem; color: var(--muted); text-transform: uppercase;
  letter-spacing: 1px; }
.side-header h2 { font-size: 1.1rem; font-weight: 600; margin-top: 4px; }
.side-body { padding: 16px; }
.side-body .field { margin-bottom: 16px; }
.side-body .field-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase;
  letter-spacing: 1px; margin-bottom: 4px; }
.side-body .field-value { font-size: 0.85rem; line-height: 1.5; }
.side-body .tag { display: inline-block; padding: 2px 8px; border-radius: 4px;
  font-size: 0.75rem; font-weight: 600; margin: 2px; }
.tag-blue { background: rgba(59,130,246,0.15); color: var(--accent); }
.tag-green { background: rgba(34,197,94,0.15); color: var(--green); }
.tag-orange { background: rgba(245,158,11,0.15); color: var(--orange); }
.tag-red { background: rgba(239,68,68,0.15); color: var(--red); }
.tag-purple { background: rgba(139,92,246,0.15); color: var(--purple); }
.tag-cyan { background: rgba(6,182,212,0.15); color: var(--cyan); }

/* ── SVG styles (injected) ── */
.node-rect { cursor: pointer; transition: filter 0.2s; }
.node-rect:hover { filter: brightness(1.3); }
.node-rect.active-node { filter: brightness(1.4); stroke-width: 2.5; }
.node-label { pointer-events: none; user-select: none; }
.edge-line { fill: none; stroke-width: 2; }
.edge-path { fill: none; stroke-width: 2; }
.edge-arrow { fill: none; stroke-width: 1.5; }
.flow-dot { animation: flowMove 2s linear infinite; }
@keyframes flowMove { to { stroke-dashoffset: -20; } }
@keyframes pulse-glow {
  0%, 100% { opacity: 0.6; } 50% { opacity: 1; }
}

/* ── Responsive ── */
@media (max-width: 1100px) {
  #sidebar { display: none; }
}
</style>
</head>
<body>

<!-- LEFT RAIL -->
<nav id="nav">
  <div class="nav-header">
    <h2>Desaladora RO</h2>
    <p>Manual interactivo</p>
  </div>
  <div class="nav-section">
    <div class="nav-section-title">Diagramas</div>
    <div class="nav-item active" data-diagram="arq" onclick="switchDiagram('arq')">
      <span class="dot" style="background:var(--accent)"></span> Arquitectura General
    </div>
    <div class="nav-item" data-diagram="data" onclick="switchDiagram('data')">
      <span class="dot" style="background:var(--cyan)"></span> Flujo de Datos
    </div>
    <div class="nav-item" data-diagram="modbus" onclick="switchDiagram('modbus')">
      <span class="dot" style="background:var(--orange)"></span> Mapa Modbus
    </div>
    <div class="nav-item" data-diagram="ro" onclick="switchDiagram('ro')">
      <span class="dot" style="background:var(--green)"></span> Proceso RO
    </div>
    <div class="nav-item" data-diagram="services" onclick="switchDiagram('services')">
      <span class="dot" style="background:var(--purple)"></span> Servicios
    </div>
  </div>
  <div class="nav-section">
    <div class="nav-section-title">Info</div>
    <div class="nav-item" onclick="showProjectInfo()">
      <span class="dot" style="background:var(--muted)"></span> Sobre el proyecto
    </div>
  </div>
</nav>

<button id="nav-toggle" onclick="toggleNav()">☰</button>

<!-- MAIN -->
<div id="main">
  <div id="toolbar">
    <h1 id="toolbar-title"><span id="diagram-icon" style="color:var(--accent)">◆</span> Arquitectura General <span class="sub" id="diagram-sub">Visión general del sistema</span></h1>
  </div>
  <div id="diagram-area">
    <svg id="diagram-svg"></svg>
  </div>
</div>

<!-- RIGHT SIDEBAR -->
<aside id="sidebar">
  <div class="side-header">
    <h3 id="side-type">NODO</h3>
    <h2 id="side-title">Selecciona un nodo</h2>
  </div>
  <div class="side-body" id="side-body">
    <p style="color:var(--muted);font-size:0.85rem">Haz clic en cualquier componente del diagrama para ver sus detalles técnicos.</p>
  </div>
</aside>

const SVG = document.getElementById('diagram-svg');
const W = () => document.getElementById('diagram-area').clientWidth;
const H = () => document.getElementById('diagram-area').clientHeight;

function clearSVG() { SVG.innerHTML = ''; }

function createNode(svg, x, y, w, h, label, sub, id, color, opts = {}) {
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.setAttribute('data-id', id);
  g.style.cursor = 'pointer';

  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', opts.rx || 8);
  rect.setAttribute('fill', opts.fill || 'var(--panel)');
  rect.setAttribute('stroke', color);
  rect.setAttribute('stroke-width', '1.5');
  rect.classList.add('node-rect');
  g.appendChild(rect);

  if (opts.icon) {
    const ic = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    ic.setAttribute('x', x + w/2); ic.setAttribute('y', y + 24);
    ic.setAttribute('text-anchor', 'middle'); ic.setAttribute('fill', color);
    ic.setAttribute('font-size', opts.iconSize || '16');
    ic.textContent = opts.icon;
    g.appendChild(ic);
  }

  const lbl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  lbl.setAttribute('x', x + w/2); lbl.setAttribute('y', y + h/2 + 4);
  lbl.setAttribute('text-anchor', 'middle'); lbl.setAttribute('fill', 'var(--text)');
  lbl.setAttribute('font-size', '12'); lbl.setAttribute('font-weight', '600');
  lbl.classList.add('node-label');
  lbl.textContent = label;
  g.appendChild(lbl);

  if (sub) {
    const s = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    s.setAttribute('x', x + w/2); s.setAttribute('y', y + h/2 + 20);
    s.setAttribute('text-anchor', 'middle'); s.setAttribute('fill', 'var(--muted)');
    s.setAttribute('font-size', '9');
    s.classList.add('node-label');
    s.textContent = sub;
    g.appendChild(s);
  }

  g.addEventListener('click', () => selectNode(id));
  g.addEventListener('mouseenter', () => { rect.classList.add('active-node'); });
  g.addEventListener('mouseleave', () => { rect.classList.remove('active-node'); });
  svg.appendChild(g);
  return { g, rect, cx: x + w/2, cy: y + h/2 };
}

function createEdge(svg, x1, y1, x2, y2, color, dashed = false, animated = false) {
  const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  line.setAttribute('x1', x1); line.setAttribute('y1', y1);
  line.setAttribute('x2', x2); line.setAttribute('y2', y2);
  line.setAttribute('stroke', color);
  line.setAttribute('stroke-width', '2');
  line.classList.add('edge-line');
  if (dashed) line.setAttribute('stroke-dasharray', '6 3');
  if (animated) { line.setAttribute('stroke-dasharray', '10 6'); line.classList.add('flow-dot'); }
  svg.insertBefore(line, svg.firstChild);
}

function createEdgePath(svg, path, color, dashed = false, animated = false) {
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('d', path);
  p.setAttribute('fill', 'none'); p.setAttribute('stroke', color);
  p.setAttribute('stroke-width', '2');
  p.classList.add('edge-path');
  if (dashed) p.setAttribute('stroke-dasharray', '6 3');
  if (animated) { p.setAttribute('stroke-dasharray', '10 6'); p.classList.add('flow-dot'); }
  svg.insertBefore(p, svg.firstChild);
}

function createArrowhead(svg, id, color) {
  const defs = SVG.querySelector('defs') || (() => { const d = document.createElementNS('http://www.w3.org/2000/svg','defs'); SVG.appendChild(d); return d; })();
  const existing = defs.querySelector(`#${id}`);
  if (existing) return;
  const m = document.createElementNS('http://www.w3.org/2000/svg','marker');
  m.setAttribute('id', id); m.setAttribute('markerWidth', '8'); m.setAttribute('markerHeight', '8');
  m.setAttribute('refX', '8'); m.setAttribute('refY', '4'); m.setAttribute('orient', 'auto');
  const poly = document.createElementNS('http://www.w3.org/2000/svg','polygon');
  poly.setAttribute('points', '0 0, 8 4, 0 8');
  poly.setAttribute('fill', color);
  m.appendChild(poly); defs.appendChild(m);
}

// ─── SELECT NODE ───
function selectNode(id) {
  document.querySelectorAll('.node-rect').forEach(r => r.classList.remove('active-node'));
  const el = document.querySelector(`[data-id="${id}"]`);
  if (el) el.querySelector('.node-rect').classList.add('active-node');
  const detail = NODE_DETAILS[id];
  if (detail) {
    document.getElementById('side-type').textContent = detail.type;
    document.getElementById('side-title').textContent = detail.title;
    document.getElementById('side-body').innerHTML = detail.body;
  }
}

  });

  const tblData = [

    ['HR 7-8', 'PT101', 'Presión Alta HP', '55-65', 'bar', COLORS.orange],
    ['HR 9-10', 'PT102', 'Presión Baja LP', '2-4', 'bar', COLORS.accent],
    ['HR 11-12', 'PT201', 'Presión Permeado', '0.5-1.5', 'bar', COLORS.cyan],
    ['HR 13-14', 'CT101', 'Conductividad Alim.', '45000-55000', 'µS/cm', COLORS.accent],
    ['HR 15-16', 'CT201', 'Conductividad Perm.', '100-300', 'µS/cm', COLORS.green],
    ['HR 17-18', 'TT101', 'Temperatura', '18-25', '°C', COLORS.cyan],
    ['HR 19-20', 'AT101', 'pH Alimentación', '6.8-7.2', 'pH', COLORS.purple],
    ['HR 21-22', 'AT201', 'pH Permeado', '6.5-7.0', 'pH', COLORS.cyan],
    ['HR 23-24', 'KW101', 'Potencia Bomba HP', '45-55', 'kW', COLORS.orange],
    ['HR 25-26', 'VL101', 'Apertura Válvula', '0-100', '%', COLORS.purple],
    ['HR 27-28', 'RECOV', 'Tasa Recuperación', '40-55', '%', COLORS.green],
    ['HR 29-30', 'REJEC', 'Tasa Rechazo Sal', '98-99.9', '%', COLORS.accent],
    ['HR 31-32', 'PRODH', 'Producción Hora', 'acum.', 'm³', COLORS.cyan],

  ];
  tblData.forEach((r, i) => {

      const bg = document.createElementNS('http://www.w3.org/2000/svg','rect');
      bg.setAttribute('x', 40); bg.setAttribute('y', y - 10);

}

function buildRO() {
  const cw = W(), ch = H();
  const title = document.createElementNS('http://www.w3.org/2000/svg','text');
  title.setAttribute('x', cw/2); title.setAttribute('y', 28);
  title.setAttribute('text-anchor', 'middle'); title.setAttribute('fill', 'var(--muted)');
  title.setAttribute('font-size', '11'); title.setAttribute('font-weight', '600');
  title.textContent = 'PROCESO DE OSMOSIS INVERSA (RO)';
  SVG.appendChild(title);

  // Layout: horizontal flow
  const y0 = 60, y1 = 140, y2 = 220, y3 = 300, y4 = 400;
  const nw = 140, nh = 50;

  createArrowhead(SVG, 'ra', COLORS.accent);
  createArrowhead(SVG, 'rg', COLORS.green);
  createArrowhead(SVG, 'ro', COLORS.orange);
  createArrowhead(SVG, 'rr', COLORS.red);

  const al = (x1,y1,x2,y2,c,aid,anim) => {
    const l = document.createElementNS('http://www.w3.org/2000/svg','line');
    l.setAttribute('x1',x1); l.setAttribute('y1',y1); l.setAttribute('x2',x2); l.setAttribute('y2',y2);
    l.setAttribute('stroke',c); l.setAttribute('stroke-width','2');
    l.setAttribute('marker-end',`url(#${aid})`);
    if (anim) { l.setAttribute('stroke-dasharray','8 4'); l.classList.add('flow-dot'); }
    SVG.insertBefore(l, SVG.firstChild);
  };

  // Row 1: Intake
  const intake = createNode(SVG, 20, y0, nw, nh, 'Captación', 'Agua de Mar', 'intake', COLORS.accent, {icon:'◈',iconSize:'14'});

  // Row 2: LP Pump
  const lp = createNode(SVG, cw/2 - 30 - nw - 40, y0+100, nw, nh, 'Bomba LP', '2-4 bar', 'lp_pump', COLORS.cyan, {icon:'⟐',iconSize:'14'});

  // Row 3: HP Pump + Antiscalant
  const hp = createNode(SVG, cw/2 - nw - 20, y0+200, nw, nh, 'Bomba HP', '55-65 bar · 50kW', 'hp_pump', COLORS.orange, {icon:'⟐',iconSize:'14'});
  const ant = createNode(SVG, cw/2 + 20, y0+200, nw, nh, 'Antiscalant', 'Válvula 0-100%', 'antiscalant', COLORS.purple, {icon:'◆',iconSize:'14'});

  // Row 4: Membranes
  const mem = createNode(SVG, cw/2 - nw/2, y0+310, nw, nh, 'Membranas RO', 'Ósmosis Inversa', 'membranes', COLORS.green, {icon:'◇',iconSize:'16'});

  // Row 5: Permeate + Concentrate + Alarms
  const perm = createNode(SVG, 30, y0+420, nw, nh, 'Permeado', 'Agua Tratada', 'permeate', COLORS.green, {icon:'◈',iconSize:'14'});
  const conc = createNode(SVG, cw/2 - 10, y0+420, nw, nh, 'Concentrado', 'Salmuera', 'concentrate', COLORS.red, {icon:'◈',iconSize:'14'});
  const al1 = createNode(SVG, cw - nw - 20, y0+420, nw, nh, 'ALRM-1', 'Conductividad >400', 'alarm1', COLORS.red, {icon:'⚠',iconSize:'14'});
  const al2 = createNode(SVG, cw - nw - 20, y0+360, nw, nh, 'ALRM-2', 'Presión >62 bar', 'alarm2', COLORS.red, {icon:'⚠',iconSize:'14'});

  // Edges
  al(intake.cx + nw/2, intake.cy, lp.cx - nw/2, lp.cy, COLORS.accent, 'ra', true);
  al(lp.cx + nw/2, lp.cy, hp.cx - nw/2, hp.cy, COLORS.cyan, 'ro', true);
  al(hp.cx + nw/2, hp.cy, mem.cx - nw/2, mem.cy, COLORS.orange, 'ra', true);
  al(mem.cx - 30, mem.cy + nh/2, perm.cx + nw/2, perm.cy, COLORS.green, 'rg', true);
  al(mem.cx + 30, mem.cy + nh/2, conc.cx - nw/2, conc.cy, COLORS.orange, 'rr', true);
  al(perm.cx + nw/2, perm.cy - 20, al1.cx - nw/2, al1.cy, COLORS.red, 'rr', true);
  al(hp.cx + nw/2 - 10, hp.cy - 20, al2.cx - nw/2, al2.cy, COLORS.red, 'rr', true);
  // antiscalant
  al(lp.cx + nw/2 + 10, lp.cy + 20, ant.cx - nw/2, ant.cy, COLORS.cyan, 'ra', false);
  al(ant.cx + nw/2 - 10, ant.cy + 20, mem.cx - nw/2, mem.cy + 15, COLORS.purple, 'ra', false);

  // Process labels
  const lbl = (x, y, text, color) => {
    const t = document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x', x); t.setAttribute('y', y);
    t.setAttribute('text-anchor', 'middle'); t.setAttribute('fill', color||'var(--muted)');
    t.setAttribute('font-size', '9');
    t.textContent = text;
    SVG.appendChild(t);
  };
  lbl(intake.cx + nw/2 + 40, intake.cy - 12, 'FT-101', COLORS.accent);
  lbl(lp.cx + nw/2 + 30, lp.cy - 12, 'PT-102', COLORS.cyan);
  lbl(hp.cx - nw/2 - 30, hp.cy - 12, 'PT-101', COLORS.orange);
  lbl(mem.cx + nw/2 + 30, mem.cy - 12, 'RECOV', COLORS.green);
  lbl(perm.cx + nw/2 + 30, perm.cy - 12, 'FT-201 / CT-201', COLORS.green);
  lbl(conc.cx - nw/2 - 30, conc.cy - 12, 'FT-301', COLORS.red);

  const st = document.createElementNS('http://www.w3.org/2000/svg','text');
  st.setAttribute('x', 20); st.setAttribute('y', ch-20);
  st.setAttribute('fill', 'var(--muted)'); st.setAttribute('font-size', '9');
  st.textContent = '▲ Las alarmas se activan cuando CT-201 > 400 µS/cm (ALRM-1) o PT-101 > 62 bar (ALRM-2)';
  SVG.appendChild(st);

  selectNode('intake');
}

function buildServices() {
  const cw = W(), ch = H();
  const title = document.createElementNS('http://www.w3.org/2000/svg','text');
  title.setAttribute('x', cw/2); title.setAttribute('y', 28);
  title.setAttribute('text-anchor', 'middle'); title.setAttribute('fill', 'var(--muted)');
  title.setAttribute('font-size', '11'); title.setAttribute('font-weight', '600');
  title.textContent = 'INFRAESTRUCTURA DE SERVICIOS';
  SVG.appendChild(title);

  createArrowhead(SVG, 'sa', COLORS.accent);
  createArrowhead(SVG, 'sg', COLORS.green);
  createArrowhead(SVG, 'so', COLORS.orange);
  createArrowhead(SVG, 'sp', COLORS.purple);

  const nw = 160, nh = 50;
  const cols = 3;
  const gapX = 30, gapY = 80;
  const totalW = cols * nw + (cols - 1) * gapX;
  const startX = (cw - totalW) / 2;

  const services = [
    { id: 'svc_sim', name: 'desaladora-sim', sub: ':502 · Python', color: COLORS.cyan, row: 0, col: 0 },
    { id: 'svc_server', name: 'scada-server', sub: ':10000 · .NET 8', color: COLORS.orange, row: 0, col: 1 },
    { id: 'svc_comm', name: 'scada-comm', sub: 'Modbus TCP', color: COLORS.accent, row: 0, col: 2 },
    { id: 'svc_web', name: 'scada-web', sub: ':5000 · ASP.NET', color: COLORS.green, row: 1, col: 0 },
    { id: 'svc_dash', name: 'FastAPI Dash', sub: ':8000 · Python', color: COLORS.purple, row: 1, col: 1 },
  ];

  const nodes = services.map(s => {
    const x = startX + s.col * (nw + gapX);
    const y = 60 + s.row * (nh + gapY);
    return createNode(SVG, x, y, nw, nh, s.name, s.sub, s.id, s.color, {icon:'⚙',iconSize:'16'});
  });

  // Dependencies
  // server ← comm (dependency)
  al(svc_sim => {
    // These are done below with the al function
  });

  const al = (x1,y1,x2,y2,c,aid,anim,dashed) => {
    const l = document.createElementNS('http://www.w3.org/2000/svg','line');
    l.setAttribute('x1',x1); l.setAttribute('y1',y1); l.setAttribute('x2',x2); l.setAttribute('y2',y2);
    l.setAttribute('stroke',c); l.setAttribute('stroke-width','2');
    if (aid) l.setAttribute('marker-end',`url(#${aid})`);
    if (anim) { l.setAttribute('stroke-dasharray','8 4'); l.classList.add('flow-dot'); }
    if (dashed) { const d = l.getAttribute('stroke-dasharray'); l.setAttribute('stroke-dasharray', (d||'') + (d ? ',' : '') + '6 3'); l.setAttribute('stroke-dasharray', '6 3'); }
    SVG.insertBefore(l, SVG.firstChild);
  };

  // Dependencies: dashed = depends on
  // Comm depends on server
  const sv = nodes[1]; // server
  const co = nodes[2]; // comm
  const we = nodes[3]; // web
  const da = nodes[4]; // dash
  const si = nodes[0]; // sim

  // server → comm (depends on)
  const depLine = (from, to, color) => {
    const l = document.createElementNS('http://www.w3.org/2000/svg','line');
    l.setAttribute('x1', from.cx); l.setAttribute('y1', from.cy - nh/2);
    l.setAttribute('x2', to.cx); l.setAttribute('y2', to.cy + nh/2);
    l.setAttribute('stroke', color); l.setAttribute('stroke-width', '1.5');
    l.setAttribute('stroke-dasharray', '4 3');
    l.setAttribute('marker-end', `url(#sa)`);
    SVG.insertBefore(l, SVG.firstChild);
  };

  // Server is the hub
  depLine(sv, co, COLORS.accent);
  depLine(sv, we, COLORS.green);
  // Comm depends on sim
  depLine(si, co, COLORS.cyan);
  // Dash depends on sim
  depLine(si, da, COLORS.purple);

  // Legend for dependencies
  const lgx = startX, lgy = ch - 80;
  const lg = document.createElementNS('http://www.w3.org/2000/svg','rect');
  lg.setAttribute('x', lgx); lg.setAttribute('y', lgy);
  lg.setAttribute('width', 200); lg.setAttribute('height', 60);
  lg.setAttribute('fill', 'var(--panel)'); lg.setAttribute('stroke', 'var(--border)');
  lg.setAttribute('rx', '6');
  SVG.appendChild(lg);
  const li1 = document.createElementNS('http://www.w3.org/2000/svg','line');
  li1.setAttribute('x1', lgx+15); li1.setAttribute('y1', lgy+22);
  li1.setAttribute('x2', lgx+45); li1.setAttribute('y2', lgy+22);
  li1.setAttribute('stroke', COLORS.muted); li1.setAttribute('stroke-width', '1.5');
  li1.setAttribute('stroke-dasharray', '4 3');
  li1.setAttribute('marker-end', 'url(#sa)');
  SVG.appendChild(li1);
  const t1 = document.createElementNS('http://www.w3.org/2000/svg','text');
  t1.setAttribute('x', lgx+55); t1.setAttribute('y', lgy+26);
  t1.setAttribute('fill', 'var(--text)'); t1.setAttribute('font-size', '10');
  t1.textContent = 'Dependencia (A necesita B)';
  SVG.appendChild(t1);

  const li2 = document.createElementNS('http://www.w3.org/2000/svg','line');
  li2.setAttribute('x1', lgx+15); li2.setAttribute('y1', lgy+46);
  li2.setAttribute('x2', lgx+45); li2.setAttribute('y2', lgy+46);
  li2.setAttribute('stroke', COLORS.green); li2.setAttribute('stroke-width', '2');
  li2.setAttribute('stroke-dasharray', '8 4');
  li2.classList.add('flow-dot');
  li2.setAttribute('marker-end', 'url(#sg)');
  SVG.appendChild(li2);
  const t2 = document.createElementNS('http://www.w3.org/2000/svg','text');
  t2.setAttribute('x', lgx+55); t2.setAttribute('y', lgy+50);
  t2.setAttribute('fill', 'var(--text)'); t2.setAttribute('font-size', '10');
  t2.textContent = 'Flujo de datos (polling 1s)';
  SVG.appendChild(t2);

  selectNode('svc_sim');
}

// ─── SWITCH DIAGRAM ───
function switchDiagram(id) {
  clearSVG();
  document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
  document.querySelector(`[data-diagram="${id}"]`).classList.add('active');

  const meta = DIAGRAM_META[id];
  document.getElementById('diagram-icon').textContent = meta.icon;
  document.getElementById('toolbar-title').innerHTML =
    `${meta.icon} ${meta.title} <span class="sub">${meta.sub}</span>`;

  // Clear sidebar
  document.getElementById('side-type').textContent = 'NODO';
  document.getElementById('side-title').textContent = 'Selecciona un nodo';
  document.getElementById('side-body').innerHTML =
    '<p style="color:var(--muted);font-size:0.85rem">Haz clic en cualquier componente del diagrama para ver sus detalles técnicos.</p>';

  switch (id) {
    case 'arq': buildArquitectura(); break;
    case 'data': buildFlujoDatos(); break;
    case 'modbus': buildModbus(); break;
    case 'ro': buildRO(); break;
    case 'services': buildServices(); break;
  }
}

// ─── TOGGLE ───
function toggleNav() {
  document.getElementById('nav').classList.toggle('collapsed');
}

// ─── RESIZE ───
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const active = document.querySelector('.nav-item.active');
    if (active) switchDiagram(active.dataset.diagram);
  }, 200);
});

// ─── INIT ───
switchDiagram('arq');
</script>
