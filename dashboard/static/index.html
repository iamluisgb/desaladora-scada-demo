<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planta Desaladora RO — SCADA Dashboard</title>
<style>
:root {
  --bg: #0a0e17;
  --panel: #111827;
  --border: #1e293b;
  --text: #e2e8f0;
  --muted: #64748b;
  --accent: #3b82f6;
  --green: #22c55e;
  --red: #ef4444;
  --orange: #f59e0b;
  --cyan: #06b6d4;
  --pipe: #3b82f6;
  --pipe-glow: rgba(59,130,246,0.3);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
}
header {
  background: linear-gradient(135deg, #0f172a, #1e293b);
  border-bottom: 1px solid var(--border);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
header h1 {
  font-size: 1.3rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 10px;
}
header h1 .dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--green);
  animation: pulse-dot 2s infinite;
}
@keyframes pulse-dot {
  0%, 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0.5); }
  50% { box-shadow: 0 0 0 6px rgba(34,197,94,0); }
}
.header-info {
  display: flex; gap: 24px; font-size: 0.85rem; color: var(--muted);
}
.header-info span { display: flex; align-items: center; gap: 6px; }

/* ─── Layout ─── */
.main-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
  padding: 16px;
  max-width: 1600px;
  margin: 0 auto;
}
.row-top {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}
.row-mid {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 16px;
}
.row-bot {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

/* ─── Cards ─── */
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
}
.card-title {
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--muted);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.card-title .icon { font-size: 1rem; }

/* ─── KPI Cards ─── */
.kpi {
  text-align: center;
  padding: 20px 16px;
}
.kpi .value {
  font-size: 2rem;
  font-weight: 700;
  line-height: 1;
  margin: 8px 0 4px;
}
.kpi .unit {
  font-size: 0.8rem;
  color: var(--muted);
}
.kpi .label {
  font-size: 0.75rem;
  color: var(--muted);
  margin-top: 4px;
}
.kpi.green .value { color: var(--green); }
.kpi.cyan .value { color: var(--cyan); }
.kpi.orange .value { color: var(--orange); }
.kpi.accent .value { color: var(--accent); }

/* ─── P&ID Diagram ─── */
.pid-container {
  position: relative;
  min-height: 340px;
}
.pid-svg {
  width: 100%;
  height: 340px;
}
/* animated flow */
.pipe-flow {
  stroke-dasharray: 12 6;
  animation: flow 1s linear infinite;
}
@keyframes flow {
  to { stroke-dashoffset: -18; }
}
.pipe-flow-reverse {
  stroke-dasharray: 12 6;
  animation: flow-rev 1.5s linear infinite;
}
@keyframes flow-rev {
  to { stroke-dashoffset: 18; }
}

/* ─── Data table ─── */
.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.85rem;
}
.data-table th {
  text-align: left;
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
  color: var(--muted);
  font-weight: 500;
  font-size: 0.75rem;
  text-transform: uppercase;
}
.data-table td {
  padding: 7px 10px;
  border-bottom: 1px solid rgba(30,41,59,0.5);
}
.data-table tr:hover { background: rgba(59,130,246,0.05); }
.tag-value {
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.tag-unit { color: var(--muted); font-size: 0.8rem; margin-left: 4px; }
.status-badge {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 20px;
  font-size: 0.75rem;
  font-weight: 600;
}
.status-on { background: rgba(34,197,94,0.15); color: var(--green); }
.status-off { background: rgba(239,68,68,0.15); color: var(--red); }
.status-alarm { background: rgba(239,68,68,0.2); color: var(--red); animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: 0.5; } }

/* ─── Chart ─── */
.chart-container {
  position: relative;
  height: 200px;
}
canvas { width: 100% !important; height: 100% !important; }

/* ─── Alarm panel ─── */
.alarm-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 8px;
  margin-bottom: 6px;
  font-size: 0.85rem;
}
.alarm-active {
  background: rgba(239,68,68,0.1);
  border: 1px solid rgba(239,68,68,0.3);
}
.alarm-normal {
  background: rgba(34,197,94,0.05);
  border: 1px solid rgba(34,197,94,0.15);
}
.alarm-icon { font-size: 1.2rem; }

/* ─── Gauge ─── */
.gauge-wrap {
  display: flex;
  justify-content: center;
  gap: 30px;
  flex-wrap: wrap;
}
.gauge {
  position: relative;
  width: 120px;
  height: 120px;
}
.gauge svg { transform: rotate(-90deg); }
.gauge-bg { fill: none; stroke: var(--border); stroke-width: 8; }
.gauge-fill { fill: none; stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 0.8s ease; }
.gauge-label {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}
.gauge-label .gval { font-size: 1.3rem; font-weight: 700; }
.gauge-label .gunit { font-size: 0.7rem; color: var(--muted); }
.gauge-label .gtag { font-size: 0.65rem; color: var(--muted); margin-top: 2px; }

@media (max-width: 900px) {
  .row-top { grid-template-columns: repeat(2, 1fr); }
  .row-mid, .row-bot { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<header>
  <h1><span class="dot"></span> Planta Desaladora RO — SCADA</h1>
  <div class="header-info">
    <span id="clock">--:--:--</span>
    <span>Rapid SCADA v6</span>
    <span id="conn-status">Conectando...</span>
  </div>
</header>

<div class="main-grid">

  <!-- KPI row -->
  <div class="row-top">
    <div class="card kpi cyan" id="kpi-prod">
      <div class="card-title"><span class="icon">&#9661;</span> Producción Hoy</div>
      <div class="value" id="val-prodd">--</div>
      <div class="unit">m³</div>
    </div>
    <div class="card kpi green" id="kpi-recov">
      <div class="card-title"><span class="icon">&#9854;</span> Recuperación</div>
      <div class="value" id="val-recov">--</div>
      <div class="unit">%</div>
    </div>
    <div class="card kpi accent" id="kpi-rejec">
      <div class="card-title"><span class="icon">&#9878;</span> Rechazo Sal</div>
      <div class="value" id="val-rejec">--</div>
      <div class="unit">%</div>
    </div>
    <div class="card kpi orange" id="kpi-power">
      <div class="card-title"><span class="icon">&#9889;</span> Potencia</div>
      <div class="value" id="val-kw">--</div>
      <div class="unit">kW</div>
    </div>
  </div>

  <!-- P&ID + Gauges -->
  <div class="row-mid">
    <div class="card">
      <div class="card-title"><span class="icon">&#9881;</span> Diagrama de Proceso P&amp;ID</div>
      <div class="pid-container">
        <svg class="pid-svg" viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg">
          <!-- Background grid -->
          <defs>
            <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
              <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
            </pattern>
            <filter id="glow">
              <feGaussianBlur stdDeviation="3" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <rect width="800" height="320" fill="url(#grid)"/>

          <!-- INTAKE (left) -->
          <text x="30" y="30" fill="#64748b" font-size="11" font-weight="600">CAPTACIÓN</text>
          <rect x="20" y="40" width="80" height="50" rx="6" fill="#0c4a6e" stroke="#0ea5e9" stroke-width="1.5"/>
          <text x="60" y="60" text-anchor="middle" fill="#7dd3fc" font-size="10">Agua Mar</text>
          <text x="60" y="76" text-anchor="middle" fill="#0ea5e9" font-size="9" id="pid-ct101">-- µS/cm</text>

          <!-- Pipe: Intake → LP Pump -->
          <line x1="100" y1="65" x2="150" y2="65" stroke="#0ea5e9" stroke-width="3" class="pipe-flow"/>

          <!-- LP Pump -->
          <circle cx="170" cy="65" r="18" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
          <text x="170" y="62" text-anchor="middle" fill="#93c5fd" font-size="8">BOMBA</text>
          <text x="170" y="73" text-anchor="middle" fill="#93c5fd" font-size="7">LP</text>
          <circle cx="195" cy="48" r="6" id="pid-sp102-dot" fill="#22c55e"/>

          <!-- Pipe: LP Pump → HP Pump -->
          <line x1="188" y1="65" x2="240" y2="65" stroke="#3b82f6" stroke-width="3" class="pipe-flow"/>

          <!-- Tag FT-101 -->
          <rect x="200" y="38" width="60" height="20" rx="3" fill="#1e293b" stroke="#3b82f6" stroke-width="0.8"/>
          <text x="230" y="51" text-anchor="middle" fill="#60a5fa" font-size="8" font-weight="600" id="pid-ft101">-- m³/h</text>
          <text x="230" y="34" text-anchor="middle" fill="#64748b" font-size="7">FT-101</text>

          <!-- HP Pump -->
          <circle cx="265" cy="65" r="20" fill="#1e3a5f" stroke="#f59e0b" stroke-width="1.5"/>
          <text x="265" y="62" text-anchor="middle" fill="#fbbf24" font-size="8">BOMBA</text>
          <text x="265" y="73" text-anchor="middle" fill="#fbbf24" font-size="7">HP</text>
          <circle cx="292" cy="46" r="6" id="pid-sp101-dot" fill="#22c55e"/>

          <!-- Tag PT-101 -->
          <rect x="295" y="78" width="55" height="20" rx="3" fill="#1e293b" stroke="#f59e0b" stroke-width="0.8"/>
          <text x="322" y="91" text-anchor="middle" fill="#fbbf24" font-size="8" font-weight="600" id="pid-pt101">-- bar</text>
          <text x="322" y="75" text-anchor="middle" fill="#64748b" font-size="7">PT-101</text>

          <!-- Pipe: HP Pump → Antiscalant valve → Membranes -->
          <line x1="285" y1="65" x2="330" y2="65" stroke="#f59e0b" stroke-width="3" class="pipe-flow"/>

          <!-- Antiscalant valve -->
          <polygon points="330,55 345,65 330,75" fill="#7c3aed" stroke="#a78bfa" stroke-width="1"/>
          <text x="338" y="50" fill="#a78bfa" font-size="7" id="pid-vl101">--% VL</text>

          <line x1="345" y1="65" x2="380" y2="65" stroke="#f59e0b" stroke-width="3" class="pipe-flow"/>

          <!-- RO MEMBRANE MODULE -->
          <text x="460" y="24" text-anchor="middle" fill="#64748b" font-size="11" font-weight="600">MEMBRANAS RO</text>
          <rect x="380" y="35" width="160" height="60" rx="8" fill="#1a1a2e" stroke="#8b5cf6" stroke-width="2"/>
          <!-- membrane lines -->
          <line x1="400" y1="45" x2="400" y2="85" stroke="#6d28d9" stroke-width="1" stroke-dasharray="3 2"/>
          <line x1="420" y1="45" x2="420" y2="85" stroke="#6d28d9" stroke-width="1" stroke-dasharray="3 2"/>
          <line x1="440" y1="45" x2="440" y2="85" stroke="#6d28d9" stroke-width="1" stroke-dasharray="3 2"/>
          <line x1="460" y1="45" x2="460" y2="85" stroke="#6d28d9" stroke-width="1" stroke-dasharray="3 2"/>
          <line x1="480" y1="45" x2="480" y2="85" stroke="#6d28d9" stroke-width="1" stroke-dasharray="3 2"/>
          <line x1="500" y1="45" x2="500" y2="85" stroke="#6d28d9" stroke-width="1" stroke-dasharray="3 2"/>
          <line x1="520" y1="45" x2="520" y2="85" stroke="#6d28d9" stroke-width="1" stroke-dasharray="3 2"/>
          <text x="460" y="68" text-anchor="middle" fill="#a78bfa" font-size="10">Osmosis Inversa</text>

          <!-- PERMEATE output (top right) -->
          <line x1="540" y1="50" x2="600" y2="50" stroke="#22c55e" stroke-width="3" class="pipe-flow"/>
          <text x="600" y="30" fill="#64748b" font-size="11" font-weight="600">PERMEADO</text>
          <rect x="600" y="35" width="90" height="50" rx="6" fill="#052e16" stroke="#22c55e" stroke-width="1.5"/>
          <text x="645" y="53" text-anchor="middle" fill="#4ade80" font-size="9">Agua Tratada</text>
          <text x="645" y="67" text-anchor="middle" fill="#22c55e" font-size="9" font-weight="600" id="pid-ft201">-- m³/h</text>
          <text x="645" y="80" text-anchor="middle" fill="#16a34a" font-size="8" id="pid-ct201">-- µS/cm</text>

          <!-- CONCENTRATE output (bottom right) -->
          <line x1="540" y1="80" x2="570" y2="80" stroke="#ef4444" stroke-width="2"/>
          <line x1="570" y1="80" x2="570" y2="140" stroke="#ef4444" stroke-width="2" class="pipe-flow-reverse"/>
          <line x1="570" y1="140" x2="620" y2="140" stroke="#ef4444" stroke-width="2" class="pipe-flow"/>
          <text x="660" y="125" fill="#64748b" font-size="11" font-weight="600">CONCENTRADO</text>
          <rect x="620" y="128" width="85" height="40" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
          <text x="662" y="147" text-anchor="middle" fill="#fca5a5" font-size="9">Rechazo</text>
          <text x="662" y="160" text-anchor="middle" fill="#ef4444" font-size="9" font-weight="600" id="pid-ft301">-- m³/h</text>

          <!-- Temperature sensor -->
          <rect x="115" y="100" width="60" height="20" rx="3" fill="#1e293b" stroke="#06b6d4" stroke-width="0.8"/>
          <text x="145" y="113" text-anchor="middle" fill="#22d3ee" font-size="8" font-weight="600" id="pid-tt101">-- °C</text>
          <text x="145" y="96" text-anchor="middle" fill="#64748b" font-size="7">TT-101</text>
          <line x1="145" y1="90" x2="145" y2="83" stroke="#06b6d4" stroke-width="1"/>

          <!-- pH sensor -->
          <rect x="35" y="100" width="55" height="20" rx="3" fill="#1e293b" stroke="#a78bfa" stroke-width="0.8"/>
          <text x="62" y="113" text-anchor="middle" fill="#c4b5fd" font-size="8" font-weight="600" id="pid-at101">-- pH</text>
          <text x="62" y="96" text-anchor="middle" fill="#64748b" font-size="7">AT-101</text>

          <!-- Power indicator -->
          <rect x="240" y="100" width="55" height="20" rx="3" fill="#1e293b" stroke="#f59e0b" stroke-width="0.8"/>
          <text x="267" y="113" text-anchor="middle" fill="#fbbf24" font-size="8" font-weight="600" id="pid-kw101">-- kW</text>
          <text x="267" y="96" text-anchor="middle" fill="#64748b" font-size="7">KW-101</text>

          <!-- ALARM indicators -->
          <rect x="20" y="200" width="760" height="110" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
          <text x="40" y="222" fill="#64748b" font-size="10" font-weight="600">ESTADO DE ALARMAS</text>

          <rect x="40" y="235" width="170" height="30" rx="5" id="pid-alrm1-bg" fill="#052e16" stroke="#22c55e" stroke-width="1"/>
          <text x="125" y="254" text-anchor="middle" font-size="9" font-weight="600" id="pid-alrm1-text" fill="#4ade80">CONDUCTIVIDAD: NORMAL</text>

          <rect x="230" y="235" width="170" height="30" rx="5" id="pid-alrm2-bg" fill="#052e16" stroke="#22c55e" stroke-width="1"/>
          <text x="315" y="254" text-anchor="middle" font-size="9" font-weight="600" id="pid-alrm2-text" fill="#4ade80">PRESIÓN: NORMAL</text>

          <rect x="420" y="235" width="170" height="30" rx="5" id="pid-sp101-bg" fill="#052e16" stroke="#22c55e" stroke-width="1"/>
          <text x="505" y="254" text-anchor="middle" font-size="9" font-weight="600" id="pid-sp101-text" fill="#4ade80">BOMBA HP: ON</text>

          <rect x="610" y="235" width="150" height="30" rx="5" id="pid-sp102-bg" fill="#052e16" stroke="#22c55e" stroke-width="1"/>
          <text x="685" y="254" text-anchor="middle" font-size="9" font-weight="600" id="pid-sp102-text" fill="#4ade80">BOMBA LP: ON</text>

          <!-- Recovery / Rejection boxes -->
          <rect x="40" y="275" width="170" height="28" rx="5" fill="#1e293b" stroke="#3b82f6" stroke-width="0.8"/>
          <text x="125" y="293" text-anchor="middle" fill="#60a5fa" font-size="9" font-weight="600" id="pid-recov">RECUPERACIÓN: --%</text>

          <rect x="230" y="275" width="170" height="28" rx="5" fill="#1e293b" stroke="#3b82f6" stroke-width="0.8"/>
          <text x="315" y="293" text-anchor="middle" fill="#60a5fa" font-size="9" font-weight="600" id="pid-rejec">RECHAZO SAL: --%</text>

          <rect x="420" y="275" width="170" height="28" rx="5" fill="#1e293b" stroke="#06b6d4" stroke-width="0.8"/>
          <text x="505" y="293" text-anchor="middle" fill="#22d3ee" font-size="9" font-weight="600" id="pid-prodh">PROD. HORA: -- m³</text>

          <rect x="610" y="275" width="150" height="28" rx="5" fill="#1e293b" stroke="#06b6d4" stroke-width="0.8"/>
          <text x="685" y="293" text-anchor="middle" fill="#22d3ee" font-size="9" font-weight="600" id="pid-prodd">PROD. DÍA: -- m³</text>
        </svg>
      </div>
    </div>

    <!-- Gauges -->
    <div class="card">
      <div class="card-title"><span class="icon">&#9201;</span> Instrumentos</div>
      <div class="gauge-wrap" id="gauges">
        <!-- generated by JS -->
      </div>
    </div>
  </div>

  <!-- Charts + Alarms/Table -->
  <div class="row-bot">
    <div class="card">
      <div class="card-title"><span class="icon">&#9636;</span> Tendencias (5 min)</div>
      <div class="chart-container">
        <canvas id="trendChart"></canvas>
      </div>
    </div>
    <div class="card">
      <div class="card-title"><span class="icon">&#9888;</span> Panel de Variables</div>
      <div style="max-height:220px;overflow-y:auto;">
        <table class="data-table">
          <thead>
            <tr><th>Tag</th><th>Descripción</th><th>Valor</th></tr>
          </thead>
          <tbody id="tag-table"></tbody>
        </table>
      </div>
    </div>
  </div>

</div>

<!-- Chart.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

<script>
// ─── Gauges Setup ───
const GAUGES = [
  { id: 'g-pt101', tag: 'PT-101', label: 'Presión HP', unit: 'bar', min: 50, max: 70, color: '#f59e0b' },
  { id: 'g-ct201', tag: 'CT-201', label: 'Cond. Perm.', unit: 'µS/cm', min: 0, max: 500, color: '#22c55e', warnAt: 400 },
  { id: 'g-tt101', tag: 'TT-101', label: 'Temperatura', unit: '°C', min: 15, max: 30, color: '#06b6d4' },
  { id: 'g-at101', tag: 'AT-101', label: 'pH Alim.', unit: 'pH', min: 6, max: 8, color: '#a78bfa' },
  { id: 'g-vl101', tag: 'VL-101', label: 'Válvula', unit: '%', min: 0, max: 100, color: '#8b5cf6' },
  { id: 'g-recov', tag: 'RECOV', label: 'Recuperación', unit: '%', min: 30, max: 60, color: '#3b82f6' },
];

function createGauges() {
  const wrap = document.getElementById('gauges');
  GAUGES.forEach(g => {
    const r = 50, circ = 2 * Math.PI * r;
    wrap.innerHTML += `
      <div class="gauge" id="${g.id}">
        <svg width="120" height="120" viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="${r}" class="gauge-bg"/>
          <circle cx="60" cy="60" r="${r}" class="gauge-fill"
            stroke="${g.color}"
            stroke-dasharray="${circ}"
            stroke-dashoffset="${circ}"
            data-circ="${circ}"/>
        </svg>
        <div class="gauge-label">
          <div class="gval" style="color:${g.color}">--</div>
          <div class="gunit">${g.unit}</div>
          <div class="gtag">${g.label}</div>
        </div>
      </div>`;
  });
}
createGauges();

function updateGauge(gaugeDef, value) {
  const el = document.getElementById(gaugeDef.id);
  if (!el) return;
  const fill = el.querySelector('.gauge-fill');
  const valEl = el.querySelector('.gval');
  const circ = parseFloat(fill.dataset.circ);
  const pct = Math.min(1, Math.max(0, (value - gaugeDef.min) / (gaugeDef.max - gaugeDef.min)));
  fill.style.strokeDashoffset = circ * (1 - pct);
  valEl.textContent = value.toFixed(1);
  if (gaugeDef.warnAt && value > gaugeDef.warnAt) {
    fill.style.stroke = '#ef4444';
    valEl.style.color = '#ef4444';
  } else {
    fill.style.stroke = gaugeDef.color;
    valEl.style.color = gaugeDef.color;
  }
}

// ─── Trend Chart ───
const ctx = document.getElementById('trendChart').getContext('2d');
const trendChart = new Chart(ctx, {
  type: 'line',
  data: {
    labels: [],
    datasets: [
      { label: 'FT-101 (m³/h)', data: [], borderColor: '#3b82f6', borderWidth: 1.5, pointRadius: 0, tension: 0.3 },
      { label: 'FT-201 (m³/h)', data: [], borderColor: '#22c55e', borderWidth: 1.5, pointRadius: 0, tension: 0.3 },
      { label: 'PT-101 (bar)',   data: [], borderColor: '#f59e0b', borderWidth: 1.5, pointRadius: 0, tension: 0.3 },
      { label: 'CT-201 (µS/cm)', data: [], borderColor: '#ef4444', borderWidth: 1.5, pointRadius: 0, tension: 0.3 },
    ],
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    animation: { duration: 300 },
    plugins: {
      legend: { position: 'top', labels: { color: '#94a3b8', font: { size: 10 }, boxWidth: 12, padding: 8 } },
    },
    scales: {
      x: { display: true, ticks: { color: '#475569', font: { size: 9 }, maxTicksLimit: 8 }, grid: { color: '#1e293b' } },
      y: { display: true, ticks: { color: '#475569', font: { size: 9 } }, grid: { color: '#1e293b' } },
    },
  },
});

// ─── Update Functions ───
function setAlarmBox(idBg, idText, label, active) {
  const bg = document.getElementById(idBg);
  const txt = document.getElementById(idText);
  if (active) {
    bg.setAttribute('fill', '#450a0a');
    bg.setAttribute('stroke', '#ef4444');
    txt.setAttribute('fill', '#fca5a5');
    txt.textContent = label + ': ALARMA';
  } else {
    bg.setAttribute('fill', '#052e16');
    bg.setAttribute('stroke', '#22c55e');
    txt.setAttribute('fill', '#4ade80');
    txt.textContent = label + ': NORMAL';
  }
}

function setEquipBox(idBg, idText, label, on) {
  const bg = document.getElementById(idBg);
  const txt = document.getElementById(idText);
  if (on) {
    bg.setAttribute('fill', '#052e16'); bg.setAttribute('stroke', '#22c55e');
    txt.setAttribute('fill', '#4ade80'); txt.textContent = label + ': ON';
  } else {
    bg.setAttribute('fill', '#450a0a'); bg.setAttribute('stroke', '#ef4444');
    txt.setAttribute('fill', '#fca5a5'); txt.textContent = label + ': OFF';
  }
}

const trendData = { labels: [], ft101: [], ft201: [], pt101: [], ct201: [] };
const MAX_POINTS = 300;

function updateDashboard(data) {
  const a = data.analogs;
  const d = data.digitals;

  // KPIs
  document.getElementById('val-prodd').textContent = a['PROD-D']?.value.toFixed(0) ?? '--';
  document.getElementById('val-recov').textContent = a['RECOV']?.value.toFixed(1) ?? '--';
  document.getElementById('val-rejec').textContent = a['REJEC']?.value.toFixed(2) ?? '--';
  document.getElementById('val-kw').textContent = a['KW-101']?.value.toFixed(1) ?? '--';

  // P&ID values
  document.getElementById('pid-ft101').textContent = a['FT-101']?.value.toFixed(1) + ' m³/h';
  document.getElementById('pid-ft201').textContent = a['FT-201']?.value.toFixed(1) + ' m³/h';
  document.getElementById('pid-ft301').textContent = a['FT-301']?.value.toFixed(1) + ' m³/h';
  document.getElementById('pid-ct101').textContent = a['CT-101']?.value.toFixed(0) + ' µS/cm';
  document.getElementById('pid-ct201').textContent = a['CT-201']?.value.toFixed(0) + ' µS/cm';
  document.getElementById('pid-pt101').textContent = a['PT-101']?.value.toFixed(1) + ' bar';
  document.getElementById('pid-tt101').textContent = a['TT-101']?.value.toFixed(1) + ' °C';
  document.getElementById('pid-at101').textContent = a['AT-101']?.value.toFixed(2) + ' pH';
  document.getElementById('pid-kw101').textContent = a['KW-101']?.value.toFixed(1) + ' kW';
  document.getElementById('pid-vl101').textContent = a['VL-101']?.value.toFixed(0) + '% VL';
  document.getElementById('pid-recov').textContent = 'RECUPERACIÓN: ' + a['RECOV']?.value.toFixed(1) + '%';
  document.getElementById('pid-rejec').textContent = 'RECHAZO SAL: ' + a['REJEC']?.value.toFixed(2) + '%';
  document.getElementById('pid-prodh').textContent = 'PROD. HORA: ' + a['PROD-H']?.value.toFixed(0) + ' m³';
  document.getElementById('pid-prodd').textContent = 'PROD. DÍA: ' + a['PROD-D']?.value.toFixed(0) + ' m³';

  // Alarm boxes
  setAlarmBox('pid-alrm1-bg', 'pid-alrm1-text', 'CONDUCTIVIDAD', d['ALRM-1']?.value);
  setAlarmBox('pid-alrm2-bg', 'pid-alrm2-text', 'PRESIÓN', d['ALRM-2']?.value);
  setEquipBox('pid-sp101-bg', 'pid-sp101-text', 'BOMBA HP', d['SP-101']?.value);
  setEquipBox('pid-sp102-bg', 'pid-sp102-text', 'BOMBA LP', d['SP-102']?.value);

  // Pump dots
  document.getElementById('pid-sp101-dot').setAttribute('fill', d['SP-101']?.value ? '#22c55e' : '#ef4444');
  document.getElementById('pid-sp102-dot').setAttribute('fill', d['SP-102']?.value ? '#22c55e' : '#ef4444');

  // CT-201 alarm highlight
  const ct201El = document.getElementById('pid-ct201');
  if (d['ALRM-1']?.value) {
    ct201El.setAttribute('fill', '#ef4444');
    ct201El.style.fontWeight = '800';
  } else {
    ct201El.setAttribute('fill', '#16a34a');
    ct201El.style.fontWeight = 'normal';
  }

  // Gauges
  GAUGES.forEach(g => {
    const v = a[g.tag]?.value;
    if (v !== undefined) updateGauge(g, v);
  });

  // Trends
  const now = new Date(data.timestamp * 1000);
  const timeStr = now.toLocaleTimeString('es-ES');
  trendData.labels.push(timeStr);
  trendData.ft101.push(a['FT-101']?.value);
  trendData.ft201.push(a['FT-201']?.value);
  trendData.pt101.push(a['PT-101']?.value);
  trendData.ct201.push(a['CT-201']?.value);
  if (trendData.labels.length > MAX_POINTS) {
    trendData.labels.shift(); trendData.ft101.shift();
    trendData.ft201.shift(); trendData.pt101.shift(); trendData.ct201.shift();
  }
  trendChart.data.labels = trendData.labels;
  trendChart.data.datasets[0].data = trendData.ft101;
  trendChart.data.datasets[1].data = trendData.ft201;
  trendChart.data.datasets[2].data = trendData.pt101;
  trendChart.data.datasets[3].data = trendData.ct201;
  trendChart.update('none');

  // Tag table
  const tbody = document.getElementById('tag-table');
  let html = '';
  for (const [tag, info] of Object.entries(a)) {
    const decimals = ['AT-101','AT-201','REJEC'].includes(tag) ? 2
                   : ['CT-101','CT-201','PROD-H','PROD-D'].includes(tag) ? 0 : 1;
    html += `<tr>
      <td style="color:var(--accent);font-weight:600;font-size:0.8rem">${tag}</td>
      <td style="font-size:0.8rem">${info.desc}</td>
      <td><span class="tag-value">${info.value.toFixed(decimals)}</span><span class="tag-unit">${info.unit}</span></td>
    </tr>`;
  }
  for (const [tag, info] of Object.entries(d)) {
    const isAlarm = tag.startsWith('ALRM');
    const cls = info.value ? (isAlarm ? 'status-alarm' : 'status-on') : (isAlarm ? 'status-on' : 'status-off');
    const label = isAlarm ? (info.value ? 'ALARMA' : 'Normal') : (info.value ? 'ON' : 'OFF');
    html += `<tr>
      <td style="color:var(--accent);font-weight:600;font-size:0.8rem">${tag}</td>
      <td style="font-size:0.8rem">${info.desc}</td>
      <td><span class="status-badge ${cls}">${label}</span></td>
    </tr>`;
  }
  tbody.innerHTML = html;

  // Connection status
  document.getElementById('conn-status').textContent = 'En línea';
  document.getElementById('conn-status').style.color = '#22c55e';
}

// ─── Clock ───
function updateClock() {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('es-ES');
}
setInterval(updateClock, 1000);
updateClock();

// ─── Polling ───
async function poll() {
  try {
    const resp = await fetch('/api/live');
    const data = await resp.json();
    updateDashboard(data);
  } catch (e) {
    document.getElementById('conn-status').textContent = 'Sin conexión';
    document.getElementById('conn-status').style.color = '#ef4444';
  }
}

setInterval(poll, 1000);
poll();
</script>
